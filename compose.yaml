services:
  app:
    build: ./java
    command: ["--spring.main.keep-alive=true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/time_deposits
      SPRING_DATASOURCE_USERNAME: time_deposit
      SPRING_DATASOURCE_PASSWORD: time_deposit

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposit
      POSTGRES_PASSWORD: time_deposit
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
